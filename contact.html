<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" href="imgs/logo.png">
    <title>Contact</title>
</head>
<body>
    <header>
        <div class="topnav">
            <div class="logo">
                <a href="home.html"><img src="/imgs/logo.png" alt=""></a>
            </div>
            <div class="nav" id="navbar">
                <a href="home.html">HOME</a>
                <a href="portfolio.html">PROJECTS</a>
                <a href="contact.html">CONTACT</a>
                <a href="about.html">ABOUT</a>
            </div>
        </div>
    </header>
    <div class="contact-page-content">
        <div class="contact-information">
            <h1>Email: jamesmorton223@outlook.com</h1>
            <h2>Address: </h2>
            <div class="address">
                <p>Big Bite Creative Ltd,</p>
                <p>16-26 Albert Road,</p>
                <p>Middlesbrough, TS1 1PR</p>
            </div>
            <div class="contact-media-icons">
                <img src="https://img.icons8.com/?size=100&id=32323&format=png&color=000000" alt="INSTAGRAM ICON">
                <img src="https://img.icons8.com/?size=100&id=118497&format=png&color=000000" alt="FACEBOOK ICON">
                <img src="https://img.icons8.com/?size=100&id=3tC9EQumUAuq&format=png&color=000000" alt="GITHUB ICON">
                <img src="https://img.icons8.com/?size=100&id=rU5dKTcsJ5Sv&format=png&color=000000" alt="INTERNET ICON">
            </div>
        </div>
        <button popovertarget="popover-form" class="pop-form-btn"></button>
    </div>
    <div popover id="popover-form" class="popover">
        <div class="pop-close">
            <button popovertarget="popover-form" popovertargetaction="hide" id="pop-close-btn">X</button>
        </div>
        <div class="popover-content">
            <div class="popover-left-content">
                <h1>Contact Form</h1>
                <p>Please fill out all information on the right and then submit your message.</p>
            </div>
            <div class="popover-right-content">
                <input type="text" placeholder="Name">
                <input type="text" placeholder="Email">
                <input type="text" placeholder="Reason for Message">
                <textarea name="" id="" placeholder="Message"></textarea>
                <div class="popover-check">
                    <input type="checkbox"></input>
                    <p>Agree to Terms of Services*</p>
                </div>
                <div class="popover-submit">
                    <button><img src="https://img.icons8.com/?size=100&id=98955&format=png&color=000000" alt=""></button>
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
